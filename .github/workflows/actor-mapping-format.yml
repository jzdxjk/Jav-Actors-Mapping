name: Actor Mapping Format x AVdb 1.0.0

on:
  push:
    paths:
      - actor-mapping.xml
      - mapping_actor.xml
      - actor_mapping.json
      - xml_to_json.py
      - scripts/**
      - tests/**
      - .github/workflows/actor-mapping-format.yml
      - .github/workflows/Auto-Approve-and-merge-jzdxjk.yml
  pull_request:
    paths:
      - actor-mapping.xml
      - mapping_actor.xml
      - actor_mapping.json
      - xml_to_json.py
      - scripts/**
      - tests/**
      - .github/workflows/actor-mapping-format.yml
      - .github/workflows/Auto-Approve-and-merge-jzdxjk.yml

permissions:
  contents: write

jobs:
  check-on-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install formatter dependencies
        run: python -m pip install --upgrade pip pypinyin

      - name: Test mapping identities and merge coverage
        run: python -m unittest discover -s tests -v

      - name: Check full mapping format
        run: python scripts/format_full_mapping.py --check actor-mapping.xml

      - name: Test approval workflow repository selection
        run: node --test tests/auto-approve.test.cjs

  auto-format-on-push:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install formatter dependencies
        run: python -m pip install --upgrade pip pypinyin

      - name: Test mapping identities and merge coverage
        run: python -m unittest discover -s tests -v

      - name: Format full mapping
        run: python scripts/format_full_mapping.py --write --check actor-mapping.xml

      - name: Test approval workflow repository selection
        run: node --test tests/auto-approve.test.cjs

      - name: Generate compatibility mappings on main
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/generate_compatibility_mapping.py actor-mapping.xml mapping_actor.xml
          python xml_to_json.py actor-mapping.xml actor_mapping.json

      - name: Auto commit formatting and compatibility mappings
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: format actor mapping and update compatibility mappings'
          file_pattern: actor-mapping.xml mapping_actor.xml actor_mapping.json
